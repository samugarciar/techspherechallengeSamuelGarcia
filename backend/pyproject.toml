[project]
name = "postop-voice-agent"
version = "0.1.0"
description = "Agente de voz para seguimiento postoperatorio — Tech Sphere Challenge 2026"
requires-python = ">=3.12,<3.13"

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sse-starlette>=2.2",
    # DB
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    # LLM (cloud) — Gemini primario, Groq como escape de latencia
    "google-genai>=1.0",
    "groq>=0.13",
    # RAG local
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "docling>=2.14",
    "pymupdf>=1.25",
    # Voz local (Apple Silicon)
    "mlx-whisper>=0.4",
    "numpy>=1.26",
    "soundfile>=0.12",
    # Cliente HTTP — TTS en la nube (ElevenLabs / Cartesia) sin arrastrar sus SDK
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
